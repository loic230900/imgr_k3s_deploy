stages:
  - lint
  - build
  - scan
  - validate
  - deploy

variables:
  REGISTRY: registry.app.unistra.fr
  IMAGE_BASE: $REGISTRY/waltzing/projet-cloud-virt
  TRIVY_VERSION: "0.55.2"
  YAMLLINT_VERSION: "1.35.1"
  ANSIBLE_LINT_VERSION: "24.7.0"
  ANSIBLE_VERSION: "10.5.0"
  KUSTOMIZE_VERSION: "5.4.3"

.lint-base:
  stage: lint
  image: python:3.12-slim
  only:
    - main
    - merge_requests
  needs: []
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pipcache
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

yamllint:
  extends: .lint-base
  cache:
    key: pip-yamllint-v1
    paths:
      - .pipcache/
  script:
    - pip install --quiet "yamllint==${YAMLLINT_VERSION}"
    - yamllint --version
    - yamllint --strict --format=parsable .

ansible-lint:
  extends: .lint-base
  cache:
    key: pip-ansible-lint-v1
    paths:
      - .pipcache/
  script:
    - pip install --quiet "ansible==${ANSIBLE_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}"
    - ansible-lint --version
    - ansible-lint --offline --strict --format=pep8 deploy/playbook.yml

build-backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  only:
    - main
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile.api"
      --target backend
      --destination "${IMAGE_BASE}/backend:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_BASE}/backend:latest"

build-worker:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  only:
    - main
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile.api"
      --target worker
      --destination "${IMAGE_BASE}/worker:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_BASE}/worker:latest"

build-frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  only:
    - main
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile.web"
      --destination "${IMAGE_BASE}/frontend:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_BASE}/frontend:latest"

.trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:$TRIVY_VERSION
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $REGISTRY_USER
    TRIVY_PASSWORD: $REGISTRY_PASSWORD
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: .trivycache/
  cache:
    key: trivy-db-v1
    paths:
      - .trivycache/
  only:
    - main
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-*.txt

scan-backend:
  extends: .trivy-scan
  needs:
    - build-backend
  script:
    - trivy --version
    - trivy image
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 1
      --scanners vuln
      $IMAGE_BASE/backend:$CI_COMMIT_SHORT_SHA | tee trivy-backend.txt

scan-worker:
  extends: .trivy-scan
  needs:
    - build-worker
  script:
    - trivy --version
    - trivy image
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 1
      --scanners vuln
      $IMAGE_BASE/worker:$CI_COMMIT_SHORT_SHA | tee trivy-worker.txt

scan-frontend:
  extends: .trivy-scan
  needs:
    - build-frontend
  script:
    - trivy --version
    - trivy image
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 1
      --scanners vuln
      $IMAGE_BASE/frontend:$CI_COMMIT_SHORT_SHA | tee trivy-frontend.txt

.kustomize-runner:
  image: alpine:latest
  cache:
    key: kustomize-v${KUSTOMIZE_VERSION}
    paths:
      - .kustomize/
  before_script:
    - apk add --no-cache openssh-client curl tar
    - |
      if [ ! -x .kustomize/kustomize ]; then
        mkdir -p .kustomize
        curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C .kustomize
      fi
    - export PATH="$CI_PROJECT_DIR/.kustomize:$PATH"
    - kustomize version
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H bastion.maurice-cloud.fr >> ~/.ssh/known_hosts 2>/dev/null

dry-run-manifests:
  extends: .kustomize-runner
  stage: validate
  only:
    - main
  needs:
    - yamllint
    - ansible-lint
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dry-run-output.txt
      - manifest-bundle.yml
  script:
    - set -e
    - set -o pipefail
    - ': > dry-run-output.txt'
    - kustomize build k8s/overlays/prod > manifest-bundle.yml
    - wc -l manifest-bundle.yml
    - |
      for VM in vm1.waltzing.internal.maurice-cloud.fr vm2.waltzing.internal.maurice-cloud.fr vm3.waltzing.internal.maurice-cloud.fr; do
        echo "=== Trying $VM ===" | tee -a dry-run-output.txt
        if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -o ProxyJump=student@bastion.maurice-cloud.fr \
              ubuntu@$VM \
              "export KUBECONFIG=/home/ubuntu/.kube/config && kubectl apply --dry-run=server -f -" \
              < manifest-bundle.yml 2>&1 | tee -a dry-run-output.txt; then
          echo "=== Dry-run succeeded via $VM ===" | tee -a dry-run-output.txt
          exit 0
        fi
        echo "=== $VM failed, trying next ===" | tee -a dry-run-output.txt
      done
      echo "=== All nodes unreachable or dry-run failed ===" | tee -a dry-run-output.txt
      exit 1

deploy:
  extends: .kustomize-runner
  stage: deploy
  only:
    - main
  when: manual
  script:
    - set -e
    - set -o pipefail
    - cd k8s/overlays/prod
    - kustomize edit set image $IMAGE_BASE/backend=$IMAGE_BASE/backend:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image $IMAGE_BASE/worker=$IMAGE_BASE/worker:$CI_COMMIT_SHORT_SHA
    - kustomize edit set image $IMAGE_BASE/frontend=$IMAGE_BASE/frontend:$CI_COMMIT_SHORT_SHA
    - kustomize build . > $CI_PROJECT_DIR/manifest-bundle.yml
    - cd $CI_PROJECT_DIR
    - wc -l manifest-bundle.yml
    - |
      DEPLOY_CMD="export KUBECONFIG=/home/ubuntu/.kube/config && \
        kubectl apply -f - && \
        kubectl -n imgr rollout status deployment/backend --timeout=120s && \
        kubectl -n imgr rollout status deployment/worker --timeout=120s && \
        kubectl -n imgr rollout status deployment/frontend --timeout=120s"

      for VM in vm1.waltzing.internal.maurice-cloud.fr vm2.waltzing.internal.maurice-cloud.fr vm3.waltzing.internal.maurice-cloud.fr; do
        echo "Trying $VM..."
        if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -o ProxyJump=student@bastion.maurice-cloud.fr \
              ubuntu@$VM "$DEPLOY_CMD" < manifest-bundle.yml; then
          echo "Deploy succeeded via $VM"
          exit 0
        fi
        echo "$VM unreachable, trying next..."
      done
      echo "All nodes unreachable"
      exit 1
