stages:
  - lint
  - build
  - scan
  - validate
  - deploy
  - ops

variables:
  REGISTRY: registry.app.unistra.fr
  IMAGE_BASE: $REGISTRY/waltzing/projet-cloud-virt
  TRIVY_VERSION: "0.55.2"
  YAMLLINT_VERSION: "1.35.1"
  ANSIBLE_LINT_VERSION: "24.7.0"
  ANSIBLE_VERSION: "10.5.0"
  KUSTOMIZE_VERSION: "5.4.3"
  PIPELINE_TYPE:
    value: "standard"
    description: >-
      standard = livraison de code (lint/build/scan/deploy).
      ops = intervention infra (bootstrap, drain, uncordon, cordon-only,
      maintenance, rebalance, rolling-maintenance, decommission,
      reset-cluster, rotate-secrets).
  TARGET:
    value: "vm2"
    description: "VM cible (vm1, vm2, vm3) pour les jobs ops qui agissent sur un nœud spécifique. Ignoré par rolling-maintenance et reset-cluster."
  CONFIRM:
    value: ""
    description: "Gate des jobs destructifs. YES_DESTROY = decommission. NUKE_EVERYTHING = reset-cluster (efface K3s + keepalived sur les 3 VMs)."

include:
  - local: 'cicd/standard.yml'
  - local: 'cicd/ops.yml'

.lint-base:
  stage: lint
  image: python:3.12-slim
  rules:
    - if: $PIPELINE_TYPE == "standard"
    - when: never
  needs: []
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pipcache
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

.kaniko-base:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $PIPELINE_TYPE == "standard" && $CI_COMMIT_REF_PROTECTED == "true"
    - when: never
  before_script:
    # DOCKER_AUTH_CONFIG (variable CI) contient les auths Docker Hub + registre Unistra,
    # kaniko lit /kaniko/.docker/config.json pour les pulls de base images et le push.
    - mkdir -p /kaniko/.docker
    - echo "$DOCKER_AUTH_CONFIG" > /kaniko/.docker/config.json

.trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:$TRIVY_VERSION
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $REGISTRY_USER
    TRIVY_PASSWORD: $REGISTRY_PASSWORD
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: .trivycache/
  cache:
    key: trivy-db-v1
    paths:
      - .trivycache/
  rules:
    - if: $PIPELINE_TYPE == "standard" && $CI_COMMIT_REF_PROTECTED == "true"
    - when: never
  allow_failure: true
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - trivy-*.txt

.kustomize-runner:
  image: alpine:latest
  cache:
    key: kustomize-v${KUSTOMIZE_VERSION}
    paths:
      - .kustomize/
  before_script:
    - apk add --no-cache openssh-client curl tar
    - |
      if [ ! -x .kustomize/kustomize ]; then
        mkdir -p .kustomize
        curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C .kustomize
      fi
    - export PATH="$CI_PROJECT_DIR/.kustomize:$PATH"
    - kustomize version
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H bastion.maurice-cloud.fr >> ~/.ssh/known_hosts 2>/dev/null

.ansible-base:
  image: alpine:3.20
  variables:
    ANSIBLE_ROLES_PATH: ./roles
    ANSIBLE_HOST_KEY_CHECKING: "False"
  before_script:
    - apk add --no-cache ansible-core openssh-client bash
    - ansible-galaxy collection install community.general ansible.posix
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H bastion.maurice-cloud.fr >> ~/.ssh/known_hosts 2>/dev/null
    - |
      cat > ~/.ssh/config <<EOF
      Host bastion-cloud
          Hostname bastion.maurice-cloud.fr
          User student
          StrictHostKeyChecking no
      Host vm1 vm2 vm3
          Hostname %h.waltzing.internal.maurice-cloud.fr
          User ubuntu
          ProxyJump bastion-cloud
          IdentityFile ~/.ssh/id_ed25519
          StrictHostKeyChecking no
      EOF
    - chmod 600 ~/.ssh/config
