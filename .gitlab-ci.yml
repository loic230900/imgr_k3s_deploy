stages:
  - build
  - deploy

variables:
  REGISTRY: registry.app.unistra.fr
  IMAGE_BASE: $REGISTRY/waltzing/projet-cloud-virt

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind #Docker in Docker pour construire l'image
  only:
    - main
  script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY
    - docker build -f docker/Dockerfile.api --target backend -t $IMAGE_BASE/backend:$CI_COMMIT_SHORT_SHA -t $IMAGE_BASE/backend:latest .
    - docker push $IMAGE_BASE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_BASE/backend:latest

build-worker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  only:
    - main
  script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY
    - docker build -f docker/Dockerfile.api --target worker -t $IMAGE_BASE/worker:$CI_COMMIT_SHORT_SHA -t $IMAGE_BASE/worker:latest .
    - docker push $IMAGE_BASE/worker:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_BASE/worker:latest

build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  only:
    - main
  script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY
    - docker build -f docker/Dockerfile.web -t $IMAGE_BASE/frontend:$CI_COMMIT_SHORT_SHA -t $IMAGE_BASE/frontend:latest .
    - docker push $IMAGE_BASE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_BASE/frontend:latest

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  when: manual
  script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H bastion.maurice-cloud.fr >> ~/.ssh/known_hosts 2>/dev/null
    - |
      DEPLOY_CMD="kubectl -n imgr set image \
        deployment/backend backend=$IMAGE_BASE/backend:$CI_COMMIT_SHORT_SHA \
        deployment/worker worker=$IMAGE_BASE/worker:$CI_COMMIT_SHORT_SHA \
        deployment/frontend frontend=$IMAGE_BASE/frontend:$CI_COMMIT_SHORT_SHA && \
        kubectl -n imgr rollout status deployment/backend --timeout=120s && \
        kubectl -n imgr rollout status deployment/worker --timeout=120s && \
        kubectl -n imgr rollout status deployment/frontend --timeout=120s"

      for VM in vm1 vm2 vm3; do
        echo "Trying $VM..."
        if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -o ProxyJump=student@bastion.maurice-cloud.fr \
              ubuntu@$VM "$DEPLOY_CMD"; then
          echo "Deploy succeeded via $VM"
          exit 0
        fi
        echo "$VM unreachable, trying next..."
      done
      echo "All nodes unreachable"
      exit 1