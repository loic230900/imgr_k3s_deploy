drain:
  extends: .ansible-base
  stage: ops
  rules:
    - if: $PIPELINE_TYPE == "ops" && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
    - when: never
  script:
    - cd deploy
    - ansible-playbook -i inventory.ini drain.yml -e target=$TARGET

