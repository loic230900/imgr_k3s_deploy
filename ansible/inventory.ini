[init]
vm1 ansible_host=vm1

[join]
vm2 ansible_host=vm2
vm3 ansible_host=vm3

[k3s:children]
init
join

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519_cloud
vxlan_network=192.168.27
floating_ip=192.168.27.110
k3s_server_ip=192.168.27.101
# Auto-deduit depuis inventory_hostname (vmN). Plancher VRRP a 10 pour eviter MASTER accidentel.
node_index={{ inventory_hostname | regex_replace('^vm', '') | int }}
node_ip_suffix={{ 100 + (node_index | int) }}
keepalived_priority={{ [200 - (node_index | int) * 50, 10] | max }}
