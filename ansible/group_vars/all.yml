# Source de vérité: variables d'environnement (CI GitLab ou .env local).
# Précédemment Ansible Vault, migré pour aligner avec le pipeline CI sans
# duplication de secret material entre Vault et CI Variables.

# Sensibles. Ces variables n'ont aucune valeur en clair dans le repo et
# doivent être présentes dans l'environnement Ansible (CI ou .env).
celery_broker_url: "{{ lookup('env', 'IMGR_CELERY_BROKER_URL') }}"
aws_access_key_id: "{{ lookup('env', 'IMGR_AWS_ACCESS_KEY_ID') }}"
aws_secret_access_key: "{{ lookup('env', 'IMGR_AWS_SECRET_ACCESS_KEY') }}"
registry_username: "{{ lookup('env', 'REGISTRY_USER') }}"
registry_password: "{{ lookup('env', 'REGISTRY_PASSWORD') }}"

# Non sensibles.
s3_bucket_name: "{{ lookup('env', 'IMGR_S3_BUCKET_NAME') | default('cloud-virt-mai-waltzing-images', true) }}"
aws_region_name: "{{ lookup('env', 'IMGR_AWS_REGION_NAME') | default('eu-north-1', true) }}"
registry_server: "{{ lookup('env', 'IMGR_REGISTRY_SERVER') | default('registry.app.unistra.fr', true) }}"

# Configuration K3s etcd snapshots vers S3.
# Schedule 24h pour limiter la facture S3 dans le cadre du
# projet. En prod réelle on viserait 12h ou moins (RPO plus court).
k3s_etcd_snapshot_schedule: "0 3 * * *"
k3s_etcd_snapshot_retention: 7
k3s_etcd_snapshot_s3_folder: "k3s-etcd-snapshots"
