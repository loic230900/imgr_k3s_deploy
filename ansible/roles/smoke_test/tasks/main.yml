# Smoke test post-bootstrap / post-rotate-secrets.
# Upload une PNG 1x1, attend la generation thumbnail (worker + RabbitMQ + S3),
# GET /, GET /health. Tourne sur 1 VM (run_once + delegate_to premier host k3s).
# En cas d'echec, le play fail mais le cluster reste en place
# (pas de rollback automatique sur bootstrap).

- name: "Smoke: generate test PNG (1x1 pixel)"
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      echo iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGBgAAAABQABh6FO1AAAAABJRU5ErkJggg== \
        | base64 -d > /tmp/smoke.png
    creates: /tmp/smoke.png
    executable: /bin/bash
  run_once: true
  delegate_to: "{{ groups['k3s'][0] }}"

- name: "Smoke: upload via /image (POST multipart, curl sur la VM)"
  # uri/form-multipart resout filename cote controller (action plugin),
  # donc on passe par curl pour rester sur vm1 ou la PNG existe.
  ansible.builtin.command:
    argv:
      - curl
      - -fsS
      - -X
      - POST
      - -F
      - file=@/tmp/smoke.png
      - http://localhost:8080/image
  register: smoke_test_upload
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['k3s'][0] }}"

- name: Smoke - parse image ID
  ansible.builtin.set_fact:
    smoke_test_image_id: "{{ (smoke_test_upload.stdout | from_json).id }}"
  run_once: true

- name: Smoke - GET /image/{id} (lit l'original sur S3)
  ansible.builtin.uri:
    url: "http://localhost:8080/image/{{ smoke_test_image_id }}"
    method: GET
    status_code: [200, 302]
  run_once: true
  delegate_to: "{{ groups['k3s'][0] }}"

- name: Smoke - GET /image/{id}/big (attend que le worker ait genere le thumbnail)
  ansible.builtin.uri:
    url: "http://localhost:8080/image/{{ smoke_test_image_id }}/big"
    method: GET
    status_code: [200, 302]
  register: smoke_test_thumb
  retries: 15
  delay: 2
  until: smoke_test_thumb.status in [200, 302]
  run_once: true
  delegate_to: "{{ groups['k3s'][0] }}"

- name: Smoke - GET / (frontend)
  ansible.builtin.uri:
    url: http://localhost:8081/
    method: GET
    status_code: 200
  run_once: true
  delegate_to: "{{ groups['k3s'][0] }}"

- name: Smoke - GET /health (backend)
  ansible.builtin.uri:
    url: http://localhost:8080/health
    method: GET
    status_code: 200
    return_content: true
  register: smoke_test_health
  run_once: true
  delegate_to: "{{ groups['k3s'][0] }}"

- name: Smoke - cleanup S3 (best effort, supprime les 5 objets de test)
  ansible.builtin.command:
    argv:
      - sudo
      - k3s
      - kubectl
      - -n
      - imgr
      - exec
      - deploy/backend
      - --
      - python
      - -c
      - >-
        from image_api.storage import bucket;
        [bucket.Object(p+'/{{ smoke_test_image_id }}').delete()
        for p in ['original','big','medium','small','tiny']]
  run_once: true
  delegate_to: "{{ groups['k3s'][0] }}"
  changed_when: false
  failed_when: false

- name: Smoke - PASSED
  ansible.builtin.debug:
    msg: >-
      Smoke OK - upload {{ smoke_test_image_id }} + thumbnail genere
      + frontend + health = {{ smoke_test_health.content }} (5 objets S3 supprimes)
  run_once: true
