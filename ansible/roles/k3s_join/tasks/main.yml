- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_join_binary

- name: Detect VXLAN interface
  shell: |
    set -o pipefail
    ip -o addr show | grep '{{ vxlan_network }}\.' | awk '{print $2}' | head -1
  args:
    executable: /bin/bash
  register: k3s_join_vxlan_iface
  changed_when: false
  check_mode: false

- name: Fail if VXLAN interface not found
  fail:
    msg: "No interface found with IP in {{ vxlan_network }}.0/24"
  when: k3s_join_vxlan_iface.stdout == ""

- name: Join K3s cluster as server
  shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ k3s_server_ip }}:6443" \
      K3S_TOKEN="{{ hostvars['vm1'].k3s_init_token }}" \
      INSTALL_K3S_EXEC="server" sh -s - \
      --disable=traefik \
      --tls-san={{ floating_ip }} \
      --flannel-iface={{ k3s_join_vxlan_iface.stdout }} \
      --node-ip={{ vxlan_network }}.{{ node_ip_suffix }} \
      --service-node-port-range=8000-32767
  args:
    executable: /bin/bash
  when: not k3s_join_binary.stat.exists
  changed_when: not k3s_join_binary.stat.exists

- name: Wait for node to be ready
  command: k3s kubectl get nodes
  register: k3s_join_ready
  retries: 30
  delay: 5
  until: k3s_join_ready.rc == 0
  changed_when: false

- name: Create .kube directory for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Copy kubeconfig for ubuntu user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Update kubeconfig server address to floating IP
  replace:
    path: /home/ubuntu/.kube/config
    regexp: 'https://127\.0\.0\.1:6443'
    replace: 'https://{{ floating_ip }}:6443'
    mode: "0600"
