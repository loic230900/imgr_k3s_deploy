- name: Create k8s manifests directory
  file:
    path: /home/ubuntu/k8s
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  run_once: true

- name: Create k8s base directory
  file:
    path: /home/ubuntu/k8s/base
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  run_once: true

- name: Create k8s overlay directory
  file:
    path: /home/ubuntu/k8s/overlays/prod
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  run_once: true

- name: Copy k8s base manifests to server
  copy:
    src: "{{ playbook_dir }}/../k8s/base/"
    dest: /home/ubuntu/k8s/base/
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  run_once: true

- name: Copy k8s overlay to server
  copy:
    src: "{{ playbook_dir }}/../k8s/overlays/prod/"
    dest: /home/ubuntu/k8s/overlays/prod/
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  run_once: true

- name: Template application secrets
  template:
    src: "{{ playbook_dir }}/templates/k8s-secret.yml.j2"
    dest: /home/ubuntu/k8s/secret.yml
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  run_once: true
  no_log: true

- name: Create imgr namespace
  command: k3s kubectl apply -f /home/ubuntu/k8s/base/namespace.yml
  run_once: true
  changed_when: false

- name: Create image pull secret (registry-creds)
  shell: |
    set -o pipefail
    k3s kubectl -n imgr create secret docker-registry registry-creds \
      --docker-server={{ registry_server }} \
      --docker-username={{ registry_username }} \
      --docker-password={{ registry_password }} \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  run_once: true
  changed_when: false
  no_log: true

- name: Apply application secrets
  command: k3s kubectl apply -f /home/ubuntu/k8s/secret.yml
  run_once: true
  changed_when: false
  no_log: true

# --server-side requis: client-side apply merge les 2 topologySpreadConstraints
# par topologyKey seul, ce qui ecrase la soft global ScheduleAnyway. SSA respecte
# les listMapKeys (topologyKey, whenUnsatisfiable) et preserve les 2 contraintes.
- name: Apply all k8s manifests via kustomize overlay (server-side)
  command: >-
    k3s kubectl apply --server-side --force-conflicts
    -k /home/ubuntu/k8s/overlays/prod/
  run_once: true
  changed_when: false

- name: Wait for backend rollout
  command: k3s kubectl -n imgr rollout status deployment/backend --timeout=120s
  changed_when: false
  run_once: true

- name: Wait for worker rollout
  command: k3s kubectl -n imgr rollout status deployment/worker --timeout=120s
  changed_when: false
  run_once: true

- name: Wait for frontend rollout
  command: k3s kubectl -n imgr rollout status deployment/frontend --timeout=120s
  changed_when: false
  run_once: true

# HPA scale-with-N: backend max=N+1, worker max=N+2 ou N est la taille du cluster.
# Permet a l'ajout d'une VM d'etendre automatiquement la capacite, et a la
# decommission de la reduire (evite que HPA scale au-dela de la capacite restante).
- name: Patch HPA maxReplicas based on cluster size
  ansible.builtin.shell:
    cmd: |
      N={{ groups['k3s'] | length }}
      k3s kubectl -n imgr patch hpa backend-hpa --type=merge \
        -p "{\"spec\":{\"maxReplicas\":$((N+1))}}"
      k3s kubectl -n imgr patch hpa worker-hpa --type=merge \
        -p "{\"spec\":{\"maxReplicas\":$((N+2))}}"
    executable: /bin/bash
  run_once: true
  changed_when: true

- name: Clean up secret file from disk
  file:
    path: /home/ubuntu/k8s/secret.yml
    state: absent
  run_once: true
