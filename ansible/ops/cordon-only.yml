# Marque un nœud comme non-schedulable sans évincer les pods existants.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/ops/cordon-only.yml -e target=vm3
- name: Cordon a node, no eviction
  hosts: "{{ target | default('__no_target__') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Pick a control-plane node that is not the target
      ansible.builtin.set_fact:
        control_host: "{{ groups['k3s'] | difference([inventory_hostname]) | first }}"

    - name: Cordon the target node
      ansible.builtin.command:
        cmd: k3s kubectl cordon {{ inventory_hostname }}
      delegate_to: "{{ control_host }}"
      changed_when: true

    - name: Notice for operator
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} est cordoné, les pods existants restent en place.
          Pour lever, lancer 'uncordon.yml -e target={{ inventory_hostname }}'.
