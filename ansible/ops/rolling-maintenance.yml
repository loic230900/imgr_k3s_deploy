# Drain + reboot + uncordon de toutes les VM, séquentiellement (serial: 1).
# Usage: ansible-playbook -i ansible/inventory.ini ansible/ops/rolling-maintenance.yml

- name: Pre-snapshot etcd vers S3 (filet avant rolling)
  hosts: k3s[0]
  become: true
  gather_facts: false
  tasks:
    # K3s suffixe --name avec un timestamp, snapshot pousse vers S3 via config.yaml.
    - name: Snapshot etcd
      ansible.builtin.command:
        cmd: k3s etcd-snapshot save --name pre-rolling
      changed_when: true

- name: Rolling maintenance, toutes les VM séquentiellement
  hosts: k3s
  become: true
  gather_facts: false
  serial: 1
  vars:
    drain_timeout: 180
    reboot_timeout: 600
  tasks:
    - name: Pick a control-plane node that is not the target
      ansible.builtin.set_fact:
        control_host: "{{ groups['k3s'] | difference([inventory_hostname]) | first }}"

    # control_host peut être un node fraîchement rebooté à l'itération précédente,
    # son apiserver peut répondre ServiceUnavailable le temps que le cache se peuple.
    - name: Pre-flight, fetch cluster nodes JSON
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o json
      register: nodes_json
      changed_when: false
      check_mode: false
      delegate_to: "{{ control_host }}"
      retries: 30
      delay: 2
      until:
        - nodes_json.rc == 0
        - (nodes_json.stdout | from_json).get('items', []) | length >= 3

    - name: Pre-flight, assert at least 3 Ready nodes before drain
      ansible.builtin.assert:
        that:
          - >-
            (nodes_json.stdout | from_json)['items']
            | map(attribute='status.conditions')
            | map('selectattr', 'type', 'equalto', 'Ready')
            | map('selectattr', 'status', 'equalto', 'True')
            | map('list') | select | list | length >= 3
        fail_msg: "Refusing to drain {{ inventory_hostname }}, fewer than 3 Ready nodes."

    - name: Cordon and drain the target node
      ansible.builtin.command:
        cmd: >-
          k3s kubectl drain {{ inventory_hostname }}
          --ignore-daemonsets
          --delete-emptydir-data
          --timeout={{ drain_timeout }}s
      delegate_to: "{{ control_host }}"
      changed_when: true

    - name: Reboot the target node
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Uncordon the target node
      ansible.builtin.command:
        cmd: k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ control_host }}"
      changed_when: true

    - name: Post-flight, wait for the node to be Ready again
      ansible.builtin.command:
        cmd: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=180s
      delegate_to: "{{ control_host }}"
      changed_when: false
      check_mode: false

    - name: Post-flight, count Running pods in imgr namespace
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl -n imgr get pods --field-selector=status.phase=Running --no-headers | wc -l
        executable: /bin/bash
      delegate_to: "{{ control_host }}"
      register: running_pods
      changed_when: false
      check_mode: false

    - name: Post-flight, assert at least 6 imgr pods Running before next node
      ansible.builtin.assert:
        that:
          - running_pods.stdout | int >= 6
        fail_msg: "Only {{ running_pods.stdout }} imgr pods Running after {{ inventory_hostname }}, refusing to continue."
