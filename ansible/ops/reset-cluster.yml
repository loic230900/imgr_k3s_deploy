# Reset complet, désinstalle K3s et arrête keepalived sur toutes les VM.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/ops/reset-cluster.yml -e reset_confirm=NUKE_EVERYTHING
- name: Reset cluster, désinstalle K3s et arrête keepalived sur toutes les VM
  hosts: k3s
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Pre-flight, vérifier la confirmation textuelle
      ansible.builtin.assert:
        that:
          - reset_confirm | default('') == 'NUKE_EVERYTHING'
        fail_msg: "Reset refusé. Lancer avec '-e reset_confirm=NUKE_EVERYTHING' pour confirmer la destruction du cluster."
      run_once: true
      delegate_to: localhost
      become: false

    - name: Stop K3s service
      ansible.builtin.systemd:
        name: k3s
        state: stopped
      failed_when: false

    - name: Run k3s-uninstall script
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-uninstall.sh
      args:
        removes: /usr/local/bin/k3s-uninstall.sh
      changed_when: true

    - name: Stop keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: stopped
      failed_when: false

    - name: Notice
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} reseté. K3s désinstallé, keepalived arrêté.
          Pour repartir de zéro: lancer un bootstrap (CI ou poste local).
