# Usage: ansible-playbook -i ansible/inventory.ini ansible/ops/rebalance.yml
- name: Rebalance pods across all nodes
  hosts: init
  become: true
  gather_facts: false
  vars:
    rollout_timeout: 180
  tasks:
    - name: Pre-flight, fetch cluster nodes JSON
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o json
      register: nodes_json
      changed_when: false
      check_mode: false

    - name: Pre-flight, assert at least 3 Ready nodes
      ansible.builtin.assert:
        that:
          - >-
            (nodes_json.stdout | from_json)['items']
            | map(attribute='status.conditions')
            | map('selectattr', 'type', 'equalto', 'Ready')
            | map('selectattr', 'status', 'equalto', 'True')
            | map('list') | select | list | length >= 3
        fail_msg: "Refusing to rebalance, fewer than 3 Ready nodes."

    - name: Targeted pod migration toward 2-2-2
      # Algo deterministe: a chaque iteration, migrer 1 pod du noeud le
      # plus charge vers le moins charge en delete + recreate. Le delete
      # laisse la place au scheduler de placer le nouveau pod sur la VM
      # cible via la per-service constraint. Convergence en skew/2 iter.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          NODES=$(k3s kubectl get nodes -o jsonpath='{.items[*].metadata.name}')

          count_per_node() {
            for n in $NODES; do
              c=$(k3s kubectl -n imgr get pods \
                    --field-selector=status.phase=Running \
                    --no-headers -o wide 2>/dev/null \
                  | awk -v node=$n '$7==node' | wc -l)
              echo "$c $n"
            done
          }

          measure_skew() {
            local maxc minc
            maxc=$(count_per_node | awk '{print $1}' | sort -n | tail -1)
            minc=$(count_per_node | awk '{print $1}' | sort -n | head -1)
            echo $((maxc - minc))
          }

          extreme_node() { count_per_node | sort -n | $1 -1 | awk '{print $2}'; }

          max_iter=10
          i=0
          while [ $i -lt $max_iter ]; do
            i=$((i + 1))
            s=$(measure_skew)
            echo "[iter $i] skew=$s, distribution: $(count_per_node | xargs)"
            if [ "$s" -le 1 ]; then
              echo "Converged"
              exit 0
            fi
            over=$(extreme_node tail)
            under=$(extreme_node head)
            moved=false
            for app in backend worker frontend; do
              pod_over=$(k3s kubectl -n imgr get pods -l app=$app \
                         --field-selector=status.phase=Running \
                         -o wide --no-headers \
                         | awk -v o=$over '$7==o {print $1; exit}')
              pod_under=$(k3s kubectl -n imgr get pods -l app=$app \
                          --field-selector=status.phase=Running \
                          -o wide --no-headers \
                          | awk -v u=$under '$7==u {print $1; exit}')
              if [ -n "$pod_over" ] && [ -z "$pod_under" ]; then
                echo "  Migrate $app: $over -> $under (delete $pod_over)"
                k3s kubectl -n imgr delete pod "$pod_over" --grace-period=15
                k3s kubectl -n imgr wait --for=condition=Available \
                  --timeout={{ rollout_timeout }}s deployment/$app
                moved=true
                sleep 3
                break
              fi
            done
            if [ "$moved" = false ]; then
              echo "  No migration candidate from $over to $under, stopping"
              break
            fi
          done
          echo "Final skew=$(measure_skew)"
          exit 0
        executable: /bin/bash
      register: rebalance_loop
      changed_when: true

    - name: Post-flight, count Running pods in imgr namespace
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl -n imgr get pods --field-selector=status.phase=Running --no-headers | wc -l
        executable: /bin/bash
      register: running_pods
      changed_when: false
      check_mode: false

    - name: Post-flight, assert at least 6 imgr pods Running
      ansible.builtin.assert:
        that:
          - running_pods.stdout | int >= 6
        fail_msg: "Only {{ running_pods.stdout }} imgr pods Running, expected >=6."

    - name: Post-flight, capture pod distribution per node
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl -n imgr get pods -o wide --no-headers | awk '{print $7}' | sort | uniq -c
        executable: /bin/bash
      register: distribution
      changed_when: false
      check_mode: false

    - name: Display distribution
      ansible.builtin.debug:
        msg: "{{ distribution.stdout_lines }}"

    - name: Post-flight, assert no two pods of the same service on the same node
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          violation=0
          for app in backend worker frontend; do
            dup=$(k3s kubectl -n imgr get pods -l app=$app \
                  -o jsonpath='{.items[*].spec.nodeName}' \
                  | tr ' ' '\n' | sort | uniq -d)
            if [ -n "$dup" ]; then
              echo "VIOLATION: app=$app has multiple pods on node(s): $dup" >&2
              violation=1
            fi
          done
          exit $violation
        executable: /bin/bash
      register: distribution_check
      changed_when: false
      check_mode: false
