# Usage: ansible-playbook -i ansible/inventory.ini ansible/ops/rebalance.yml
- name: Rebalance pods across all nodes
  hosts: init
  become: true
  gather_facts: false
  vars:
    rollout_timeout: 180
  tasks:
    - name: Pre-flight, fetch cluster nodes JSON
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o json
      register: nodes_json
      changed_when: false
      check_mode: false

    - name: Pre-flight, assert at least 3 Ready nodes
      ansible.builtin.assert:
        that:
          - >-
            (nodes_json.stdout | from_json)['items']
            | map(attribute='status.conditions')
            | map('selectattr', 'type', 'equalto', 'Ready')
            | map('selectattr', 'status', 'equalto', 'True')
            | map('list') | select | list | length >= 3
        fail_msg: "Refusing to rebalance, fewer than 3 Ready nodes."

    - name: Rolling restart with retry until balanced (skew <= 1) or max attempts
      # La contrainte topologySpreadConstraints DoNotSchedule par service garantit
      # 1-1-0 par service a chaque rolling restart, mais la distribution globale
      # (somme des pods par node) peut rester desequilibree selon l'ordre de
      # placement. On retry jusqu'a 3 fois pour converger vers 2-2-2; au-dela on
      # accepte (la continuite reste assuree par la garantie per-service).
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          max_attempts=3
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "=== Rebalance attempt $attempt/$max_attempts ==="
            for app in backend worker frontend; do
              k3s kubectl -n imgr rollout restart deployment/$app
            done
            for app in backend worker frontend; do
              k3s kubectl -n imgr rollout status deployment/$app \
                --timeout={{ rollout_timeout }}s
            done
            # Stabilisation: rollout status peut retourner success alors qu il
            # reste des anciens pods en Terminating (qui restent en phase
            # Running tant que la suppression n est pas effective).
            sleep 5
            counts=$(k3s kubectl -n imgr get pods \
                       --field-selector=status.phase=Running \
                       --no-headers -o wide \
                     | awk '{print $7}' | sort | uniq -c | awk '{print $1}' \
                     | sort -n)
            max_count=$(echo "$counts" | tail -1)
            min_count=$(echo "$counts" | head -1)
            skew=$((max_count - min_count))
            echo "Distribution skew = $skew (max=$max_count, min=$min_count)"
            if [ $skew -le 1 ]; then
              echo "Converged on attempt $attempt"
              exit 0
            fi
          done
          echo "WARNING: not converged after $max_attempts attempts (skew=$skew)."
          echo "Per-service constraint is still enforced (1 pod per node max),"
          echo "service continuity is preserved."
          exit 0
        executable: /bin/bash
      register: rebalance_loop
      changed_when: true

    - name: Post-flight, count Running pods in imgr namespace
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl -n imgr get pods --field-selector=status.phase=Running --no-headers | wc -l
        executable: /bin/bash
      register: running_pods
      changed_when: false
      check_mode: false

    - name: Post-flight, assert at least 6 imgr pods Running
      ansible.builtin.assert:
        that:
          - running_pods.stdout | int >= 6
        fail_msg: "Only {{ running_pods.stdout }} imgr pods Running, expected >=6."

    - name: Post-flight, capture pod distribution per node
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl -n imgr get pods -o wide --no-headers | awk '{print $7}' | sort | uniq -c
        executable: /bin/bash
      register: distribution
      changed_when: false
      check_mode: false

    - name: Display distribution
      ansible.builtin.debug:
        msg: "{{ distribution.stdout_lines }}"

    - name: Post-flight, assert no two pods of the same service on the same node
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          violation=0
          for app in backend worker frontend; do
            dup=$(k3s kubectl -n imgr get pods -l app=$app \
                  -o jsonpath='{.items[*].spec.nodeName}' \
                  | tr ' ' '\n' | sort | uniq -d)
            if [ -n "$dup" ]; then
              echo "VIOLATION: app=$app has multiple pods on node(s): $dup" >&2
              violation=1
            fi
          done
          exit $violation
        executable: /bin/bash
      register: distribution_check
      changed_when: false
      check_mode: false
