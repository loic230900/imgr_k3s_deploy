# Usage: ansible-playbook -i ansible/inventory.ini ansible/ops/rebalance.yml
- name: Rebalance pods across all nodes
  hosts: init
  become: true
  gather_facts: false
  vars:
    rollout_timeout: 180
  tasks:
    - name: Pre-flight, fetch cluster nodes JSON
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o json
      register: nodes_json
      changed_when: false
      check_mode: false

    - name: Pre-flight, assert at least 3 Ready nodes
      ansible.builtin.assert:
        that:
          - >-
            (nodes_json.stdout | from_json)['items']
            | map(attribute='status.conditions')
            | map('selectattr', 'type', 'equalto', 'Ready')
            | map('selectattr', 'status', 'equalto', 'True')
            | map('list') | select | list | length >= 3
        fail_msg: "Refusing to rebalance, fewer than 3 Ready nodes."

    - name: Sequential rolling restart with skip-if-balanced
      # Sequential + skip-if-balanced: un restart parallele relance les
      # 3 evictions K8s simultanees et oscille; sequentiel laisse l'eviction
      # topology-aware (soft global imgr) voir un etat stable et converger.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          measure_skew() {
            local counts max_count min_count
            counts=$(k3s kubectl -n imgr get pods \
                       --field-selector=status.phase=Running \
                       --no-headers -o wide \
                     | awk '{print $7}' | sort | uniq -c | awk '{print $1}' \
                     | sort -n)
            max_count=$(echo "$counts" | tail -1)
            min_count=$(echo "$counts" | head -1)
            echo $((max_count - min_count))
          }

          max_attempts=3
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "=== Rebalance cycle $attempt/$max_attempts ==="
            for app in backend worker frontend; do
              sleep 3
              cur_skew=$(measure_skew)
              if [ "$cur_skew" -le 1 ]; then
                echo "Already balanced (skew=$cur_skew), skipping $app"
                continue
              fi
              echo "--- Restart $app (current skew=$cur_skew) ---"
              k3s kubectl -n imgr rollout restart deployment/$app
              k3s kubectl -n imgr rollout status deployment/$app \
                --timeout={{ rollout_timeout }}s
              sleep 5
            done
            final_skew=$(measure_skew)
            echo "End of cycle $attempt: skew=$final_skew"
            if [ "$final_skew" -le 1 ]; then
              echo "Converged after $attempt cycle(s)"
              exit 0
            fi
          done
          echo "WARNING: not converged after $max_attempts cycles (skew=$final_skew)."
          echo "Per-service strict still enforced, continuity OK."
          exit 0
        executable: /bin/bash
      register: rebalance_loop
      changed_when: true

    - name: Post-flight, count Running pods in imgr namespace
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl -n imgr get pods --field-selector=status.phase=Running --no-headers | wc -l
        executable: /bin/bash
      register: running_pods
      changed_when: false
      check_mode: false

    - name: Post-flight, assert at least 6 imgr pods Running
      ansible.builtin.assert:
        that:
          - running_pods.stdout | int >= 6
        fail_msg: "Only {{ running_pods.stdout }} imgr pods Running, expected >=6."

    - name: Post-flight, capture pod distribution per node
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl -n imgr get pods -o wide --no-headers | awk '{print $7}' | sort | uniq -c
        executable: /bin/bash
      register: distribution
      changed_when: false
      check_mode: false

    - name: Display distribution
      ansible.builtin.debug:
        msg: "{{ distribution.stdout_lines }}"

    - name: Post-flight, assert no two pods of the same service on the same node
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          violation=0
          for app in backend worker frontend; do
            dup=$(k3s kubectl -n imgr get pods -l app=$app \
                  -o jsonpath='{.items[*].spec.nodeName}' \
                  | tr ' ' '\n' | sort | uniq -d)
            if [ -n "$dup" ]; then
              echo "VIOLATION: app=$app has multiple pods on node(s): $dup" >&2
              violation=1
            fi
          done
          exit $violation
        executable: /bin/bash
      register: distribution_check
      changed_when: false
      check_mode: false
