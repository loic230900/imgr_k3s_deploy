- name: Pre-flight, vérifier que les variables d'environnement requises sont définies
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Assert env vars sensibles présentes
      ansible.builtin.assert:
        that:
          - lookup('env', 'IMGR_CELERY_BROKER_URL') | length > 0
          - lookup('env', 'IMGR_AWS_ACCESS_KEY_ID') | length > 0
          - lookup('env', 'IMGR_AWS_SECRET_ACCESS_KEY') | length > 0
          - lookup('env', 'REGISTRY_USER') | length > 0
          - lookup('env', 'REGISTRY_PASSWORD') | length > 0
        fail_msg: >-
          Variables d'environnement manquantes. Soit sourcer ansible/.env
          (cp ansible/.env.example ansible/.env, remplir les valeurs, source),
          soit lancer depuis un job CI où les GitLab CI Variables sont injectées.

- name: Base setup on all nodes
  hosts: k3s
  become: true
  roles:
    - common

- name: Configure keepalived on all nodes
  hosts: k3s
  become: true
  roles:
    - keepalived

- name: Initialize K3s cluster (first server)
  hosts: init
  become: true
  roles:
    - k3s_init

- name: Join remaining servers to cluster
  hosts: join
  become: true
  serial: 1
  roles:
    - k3s_join

- name: Apply K3s config (etcd snaps to S3)
  hosts: k3s
  become: true
  serial: 1
  roles:
    - k3s_config

- name: Deploy application
  hosts: k3s
  become: true
  tags:
    - app
  roles:
    - app

- name: Smoke test E2E (upload + thumbnail + frontend + health, cleanup S3)
  hosts: k3s
  gather_facts: false
  tags:
    - smoke
  roles:
    - smoke_test

# Au bootstrap aucune continuite a proteger (premier deploiement, pas de trafic):
# rolling restart "gratuit" pour converger vers 2-2-2. La contrainte per-service
# garantit 1-1-0 mais autorise les 3 services a choisir la meme paire de nodes
# (vm1 vide possible). Ce play corrige la distribution globale en sortie de boot.
- name: Rebalance pod distribution toward 2-2-2 (post-bootstrap)
  import_playbook: ops/rebalance.yml
