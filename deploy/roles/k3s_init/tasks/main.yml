- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Detect VXLAN interface
  shell: |
    set -o pipefail
    ip -o addr show | grep '{{ vxlan_network }}\.' | awk '{print $2}' | head -1
  args:
    executable: /bin/bash
  register: vxlan_iface
  changed_when: false
  check_mode: false

- name: Fail if VXLAN interface not found
  fail:
    msg: "No interface found with IP in {{ vxlan_network }}.0/24"
  when: vxlan_iface.stdout == ""

- name: Install K3s (first server, cluster-init)
  shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server" sh -s - \
      --cluster-init \
      --disable=traefik \
      --tls-san={{ floating_ip }} \
      --flannel-iface={{ vxlan_iface.stdout }} \
      --node-ip={{ k3s_server_ip }} \
      --service-node-port-range=8000-32767
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  changed_when: not k3s_binary.stat.exists

- name: Wait for K3s to be ready
  command: k3s kubectl get nodes
  register: k3s_ready
  retries: 30
  delay: 5
  until: k3s_ready.rc == 0
  changed_when: false

- name: Read K3s join token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Store K3s token as fact
  set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Create .kube directory for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Copy kubeconfig for ubuntu user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Update kubeconfig server address to floating IP
  replace:
    path: /home/ubuntu/.kube/config
    regexp: 'https://127\.0\.0\.1:6443'
    replace: 'https://{{ floating_ip }}:6443'
    mode: "0600"
