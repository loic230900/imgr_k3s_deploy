- name: Create k8s manifests directory
  file:
    path: /home/ubuntu/k8s
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  run_once: true

- name: Create k8s base directory
  file:
    path: /home/ubuntu/k8s/base
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  run_once: true

- name: Create k8s overlay directory
  file:
    path: /home/ubuntu/k8s/overlays/prod
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  run_once: true

- name: Copy k8s base manifests to server
  copy:
    src: "{{ playbook_dir }}/../k8s/base/"
    dest: /home/ubuntu/k8s/base/
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  run_once: true

- name: Copy k8s overlay to server
  copy:
    src: "{{ playbook_dir }}/../k8s/overlays/prod/"
    dest: /home/ubuntu/k8s/overlays/prod/
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  run_once: true

- name: Template application secrets
  template:
    src: "{{ playbook_dir }}/templates/k8s-secret.yml.j2"
    dest: /home/ubuntu/k8s/secret.yml
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  run_once: true

- name: Create imgr namespace
  command: k3s kubectl apply -f /home/ubuntu/k8s/base/namespace.yml
  run_once: true
  changed_when: false

- name: Create image pull secret (registry-creds)
  shell: |
    set -o pipefail
    k3s kubectl -n imgr create secret docker-registry registry-creds \
      --docker-server={{ registry_server }} \
      --docker-username={{ registry_username }} \
      --docker-password={{ registry_password }} \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  run_once: true
  changed_when: false

- name: Apply application secrets
  command: k3s kubectl apply -f /home/ubuntu/k8s/secret.yml
  run_once: true
  changed_when: false

- name: Apply all k8s manifests via kustomize overlay
  command: k3s kubectl apply -k /home/ubuntu/k8s/overlays/prod/
  run_once: true
  changed_when: false

- name: Wait for backend rollout
  command: k3s kubectl -n imgr rollout status deployment/backend --timeout=120s
  changed_when: false
  run_once: true

- name: Wait for worker rollout
  command: k3s kubectl -n imgr rollout status deployment/worker --timeout=120s
  changed_when: false
  run_once: true

- name: Wait for frontend rollout
  command: k3s kubectl -n imgr rollout status deployment/frontend --timeout=120s
  changed_when: false
  run_once: true

- name: Clean up secret file from disk
  file:
    path: /home/ubuntu/k8s/secret.yml
    state: absent
  run_once: true
