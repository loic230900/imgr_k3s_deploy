# Planned maintenance: drain, reboot, uncordon a single VM
# Usage: ansible-playbook -i deploy/inventory.ini deploy/maintenance.yml -e target=vm3
- name: Planned VM maintenance, drain reboot uncordon
  hosts: "{{ target | default('__no_target__') }}"
  become: true
  gather_facts: false
  serial: 1
  vars:
    drain_timeout: 120
    reboot_timeout: 600
  tasks:
    - name: Pick a control-plane node that is not the target
      ansible.builtin.set_fact:
        control_host: "{{ groups['k3s'] | difference([inventory_hostname]) | first }}"

    - name: Pre-flight, fetch cluster nodes JSON
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o json
      register: nodes_json
      changed_when: false
      delegate_to: "{{ control_host }}"

    - name: Pre-flight, assert at least 3 Ready nodes before drain
      ansible.builtin.assert:
        that:
          - >-
            (nodes_json.stdout | from_json).items
            | map(attribute='status.conditions')
            | map('selectattr', 'type', 'equalto', 'Ready')
            | map('selectattr', 'status', 'equalto', 'True')
            | map('list') | select | list | length >= 3
        fail_msg: "Refusing to drain, fewer than 3 Ready nodes."

    - name: Cordon and drain the target node
      ansible.builtin.command:
        cmd: >-
          k3s kubectl drain {{ inventory_hostname }}
          --ignore-daemonsets
          --delete-emptydir-data
          --timeout={{ drain_timeout }}s
      delegate_to: "{{ control_host }}"
      changed_when: true

    - name: Reboot the target node
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Uncordon the target node
      ansible.builtin.command:
        cmd: k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ control_host }}"
      changed_when: true

    - name: Post-flight, wait for the node to be Ready again
      ansible.builtin.command:
        cmd: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=180s
      delegate_to: "{{ control_host }}"
      changed_when: false

    - name: Post-flight, count Running pods in imgr namespace
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl -n imgr get pods --field-selector=status.phase=Running --no-headers | wc -l
      delegate_to: "{{ control_host }}"
      register: running_pods
      changed_when: false

    - name: Post-flight, assert at least 6 imgr pods Running
      ansible.builtin.assert:
        that:
          - running_pods.stdout | int >= 6
        fail_msg: "Only {{ running_pods.stdout }} imgr pods Running, expected >=6."
