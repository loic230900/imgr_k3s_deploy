apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: imgr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: worker
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: registry-creds
      containers:
        - name: worker
          image: registry.app.unistra.fr/waltzing/projet-cloud-virt/worker:v3
          envFrom:
            - secretRef:
                name: imgr-secrets
          env:
            - name: HOME
              value: /home/appuser
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "uv run --no-dev celery -A image_api.worker inspect ping -d celery@$(hostname) | grep -q pong"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
