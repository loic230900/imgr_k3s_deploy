apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: imgr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: imgr
    spec:
      # tolerationSeconds=60 (default K8s 300). Migration plus rapide sur cluster stable.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      topologySpreadConstraints:
        # Jamais 2 pods backend sur le meme node en baseline; en scaling >3
        # tolere 2-1-1 (maxSkew=1). nodeTaintsPolicy: Honor exclut les nodes
        # cordoned/NotReady pour ne pas bloquer le rolling update pendant
        # un drain et pour reschedule proprement sur les VMs survivantes.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: backend
      imagePullSecrets:
        - name: registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: registry.app.unistra.fr/waltzing/projet-cloud-virt/backend:placeholder
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: imgr-secrets
          env:
            - name: HOME
              value: /home/appuser
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: CORS_ALLOWED_ORIGINS
              value: "https://waltzing.maurice-cloud.fr"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
