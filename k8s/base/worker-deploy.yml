apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: imgr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/part-of: imgr
    spec:
      # Celery task_time_limit (120s) : un resize en cours finit avant SIGKILL.
      terminationGracePeriodSeconds: 130
      # tolerationSeconds=60 (default K8s 300). Migration plus rapide sur cluster stable.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: worker
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: imgr
      imagePullSecrets:
        - name: registry-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.app.unistra.fr/waltzing/projet-cloud-virt/worker:placeholder
          envFrom:
            - secretRef:
                name: imgr-secrets
          env:
            - name: HOME
              value: /home/appuser
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "uv run --no-dev celery -A image_api.worker inspect ping -d celery@$(hostname) | grep -q pong"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
